{{- if .Values.fixedCABundle.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vertical-pod-autoscaler.fullname" . }}-fixed-ca-bundle
  namespace: {{ .Release.Namespace }}
  annotations:
    # Created as a hook so it exists before the pre-install certgen Job.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "-10"
  labels:
    {{- include "vertical-pod-autoscaler.labels" . | nindent 4 }}
data:
  ca-certificates.crt: |-
    {{- .Files.Get "files/ca-certificates.crt" | nindent 4 }}
{{- end }}
